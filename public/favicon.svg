<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15151A"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
  </defs>

  <!-- dark rounded square (site dark theme) -->
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="98" height="98" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- pr/ag wordmark, compacted to "p/" : white p, emerald slash -->
  <text x="51" y="45" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-5"
        text-anchor="middle" dominant-baseline="central">
    <tspan fill="#F5F5F7">p</tspan><tspan fill="#10B981">/</tspan>
  </text>
</svg>

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Public URL - it is compiled into the client bundle, so it is not a secret.
          VITE_API_URL: https://my-portfolio-server-11ub.vercel.app

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Secret FIREBASE_TOKEN is not set. Generate one with 'firebase login:ci' and add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx firebase-tools@15 deploy --only hosting:threejs --project my-portfolio-7598c --token "$FIREBASE_TOKEN"
